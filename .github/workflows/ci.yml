name: Build and Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [net8.0, net9.0, net10.0]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore Company.Security.FileUpload.slnx

      - name: Build (Release)
        run: dotnet build Company.Security.FileUpload.slnx -c Release --framework \${{ matrix.target }}

      - name: Run tests
        run: dotnet test Company.Security.FileUpload.Tests/Company.Security.FileUpload.Tests.csproj -c Debug --no-build

      - name: Run code analyzers
        run: dotnet build Company.Security.FileUpload/Company.Security.FileUpload.csproj -c Release --framework \${{ matrix.target }} 2>&1 | tee analyzer-output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-\${{ matrix.target }}
          path: '**/TestResults/*.xml'

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore Company.Security.FileUpload.slnx

      - name: Build
        run: dotnet build Company.Security.FileUpload/Company.Security.FileUpload.csproj -c Release

      - name: Check for vulnerable dependencies
        run: dotnet list package --vulnerable || true

  package:
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore Company.Security.FileUpload.slnx

      - name: Pack NuGet package
        run: dotnet pack Company.Security.FileUpload/Company.Security.FileUpload.csproj -c Release --no-build

      - name: Publish artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: '**/*.nupkg'
